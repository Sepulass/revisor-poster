<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revisor de pósters · Genética y Salud</title>
  <style>
    :root { --ink:#1f2933; --muted:#616e7c; --line:#d9e2ec; --accent:#2b6cb0; --bg:#f7f9fb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }
    h1 { font-size: 1.6rem; margin: 0 0 6px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    form, .result { background:#fff; border:1px solid var(--line); border-radius:12px; padding:22px; }
    label { display:block; font-weight:600; margin: 16px 0 6px; }
    label span { font-weight:400; color:var(--muted); }
    input[type=file], textarea { width:100%; font: inherit; }
    textarea { border:1px solid var(--line); border-radius:8px; padding:8px; min-height:64px; }
    button { margin-top: 20px; background: var(--accent); color:#fff; border:0; border-radius:8px; padding:11px 18px; font: inherit; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .status { margin-top: 14px; color: var(--muted); min-height: 1.2em; }
    .error { color:#b42318; }
    .result { margin-top: 24px; white-space: pre-wrap; font-size: .97rem; }
    .hint { font-size:.9rem; color:var(--muted); margin-top:24px; }
  </style>
</head>
<body>
<main>
  <h1>Revisor de pósters</h1>
  <p class="sub">Genética y Salud · sube tu póster para recibir retroalimentación antes de la entrega final.</p>

  <form id="form">
    <label for="code">Código de acceso <span>(te lo entrega tu profesor)</span></label>
    <input type="password" id="code" autocomplete="off" required />

    <label for="poster">Tu póster <span>(PDF, PNG o JPG)</span></label>
    <input type="file" id="poster" accept="application/pdf,image/png,image/jpeg" required />

    <label for="article">Artículo base <span>(opcional, pero permite verificar que tus datos coinciden con el artículo)</span></label>
    <input type="file" id="article" accept="application/pdf,image/png,image/jpeg" />

    <label for="notes">¿Hay algo en lo que quieras que se fije? <span>(opcional)</span></label>
    <textarea id="notes" maxlength="500" placeholder="Por ejemplo: ¿mi gráfico cumple con los 5 elementos?"></textarea>

    <button type="submit" id="send">Revisar mi póster</button>
    <div class="status" id="status"></div>
  </form>

  <section class="result" id="result" hidden></section>

  <p class="hint">Tu póster se procesa en el momento y no se guarda en esta página. La revisión es orientativa: tu profesor hace la evaluación final.</p>
</main>

<script>
  const MAX_TOTAL_BYTES = 25 * 1024 * 1024;
  const form = document.getElementById('form');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');

  function readAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function toDoc(file) {
    return { name: file.name, type: file.type, data: await readAsBase64(file) };
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.className = 'status';
    resultEl.hidden = true;

    const posterFile = document.getElementById('poster').files[0];
    const articleFile = document.getElementById('article').files[0];
    const notes = document.getElementById('notes').value;

    const total = (posterFile?.size || 0) + (articleFile?.size || 0);
    if (total > MAX_TOTAL_BYTES) {
      statusEl.className = 'status error';
      statusEl.textContent = 'Los archivos suman más de 25 MB. Comprime el PDF e intenta de nuevo.';
      return;
    }

    sendBtn.disabled = true;
    statusEl.textContent = 'Revisando tu póster… esto puede tardar un minuto.';

    try {
      const payload = {
        code: document.getElementById('code').value.trim(),
        poster: await toDoc(posterFile),
        notes,
      };
      if (articleFile) payload.article = await toDoc(articleFile);

      const res = await fetch('/api/review', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (!res.ok) {
        statusEl.className = 'status error';
        statusEl.textContent = data.error || 'Ocurrió un error.';
      } else {
        statusEl.textContent = '';
        resultEl.textContent = data.review;
        resultEl.hidden = false;
        resultEl.scrollIntoView({ behavior: 'smooth' });
      }
    } catch (err) {
      statusEl.className = 'status error';
      statusEl.textContent = 'No se pudo enviar la revisión. Revisa tu conexión e intenta de nuevo.';
    } finally {
      sendBtn.disabled = false;
    }
  });
</script>
</body>
</html>
